:root {
  color-scheme: dark;
  --void: #000000;
  --ivory: #e6e2d6;
  --bone: #b6b2a6;
  --frost: #8b897f;
  --dust: #5a5952;
  --signal: #ffb000;
  --bitmap: "Departure", ui-monospace, Menlo, Consolas, monospace;
  /* Multiples of the face's 11-unit grid, crisp on a 2x screen. */
  --small: 11px;
  --body: 16.5px;
  --big: 22px;
  --gutter: clamp(16px, 2.6vw, 44px);
}
html, body { height: 100%; }
body { margin: 0; }
body { background: var(--void); color: var(--ivory); font: var(--body)/1.45 var(--bitmap); font-variant-numeric: tabular-nums; -webkit-font-smoothing: none; font-smooth: never; overflow-x: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
input:focus { outline: none; }
img { display: block; }
#dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#root { position: relative; z-index: 1; }

.d0 { color: var(--ivory); letter-spacing: .04em; }
.d1 { color: var(--bone); }
.d2 { color: var(--frost); }
.d3 { color: var(--dust); }
.sig { color: var(--signal); }
.rev { background: var(--ivory); color: var(--void); padding: 0 .35em; }
.small { font-size: var(--small); }
.big { font-size: var(--big); line-height: 1.25; }
.upper { text-transform: uppercase; letter-spacing: .1em; }
.heavy { text-shadow: .045em 0 currentColor, 0 .03em currentColor, .045em .03em currentColor; }
.blk { display: inline-block; width: .34em; height: .34em; background: var(--signal); margin-left: .14em; vertical-align: baseline; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.act { display: inline-flex; gap: .6em; align-items: baseline; color: var(--bone); padding-block: 2px; }
.act::before { content: ">"; color: transparent; }
.act:hover, .act:focus-visible { color: var(--signal); outline: none; }
.act:hover::before, .act:focus-visible::before, .act.on::before { color: var(--signal); }
.act.on { color: var(--signal); }
.act.lead { color: var(--signal); }
.act.lead::before { color: var(--signal); }
.act:disabled { color: var(--dust); }
.act:disabled::before { color: transparent; }

/* The working screen */
.shell { height: 100dvh; min-height: 620px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-block: 22px 14px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); gap: 18px; }
.head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
.mark { font-size: 24px; letter-spacing: .14em; color: var(--ivory); margin: 0; font-weight: normal; }
.facts { display: flex; flex-wrap: wrap; gap: 2px 26px; margin-top: 6px; }
.nav { display: flex; flex-wrap: wrap; gap: 0 18px; margin-top: 10px; font-size: var(--big); }
.speed { display: flex; flex-wrap: wrap; gap: 0 10px; margin-top: 0; }
.cash { text-align: right; }
.cash .n { font-size: clamp(44px, 6.4vw, 96px); line-height: 1; letter-spacing: -.01em; color: var(--ivory); display: block; text-shadow: .045em 0 currentColor, 0 .03em currentColor, .045em .03em currentColor; }
.cash .rate { display: block; margin-top: 8px; }

.stage { display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(260px, 1fr) minmax(0, 1.5fr) minmax(360px, 1.35fr); gap: 20px clamp(24px, 3.4vw, 64px); min-height: 0; }
.col { min-height: 0; min-width: 0; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(#000 calc(100% - 34px), transparent); mask-image: linear-gradient(#000 calc(100% - 34px), transparent); }
.col::-webkit-scrollbar { display: none; }
.center { display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; gap: 10px; min-height: 0; min-width: 0; }
.rigbox { width: 100%; height: 100%; min-height: 0; container-type: size; display: grid; place-items: center; }

.slots { display: flex; flex-direction: column; gap: 10px; padding-block: 2px 18px; }
.hd.spaced, .hd + .hd { margin-top: 12px; }
.slot { display: grid; grid-template-columns: 1.1em 1fr; column-gap: 2px; width: 100%; }
.slot .car { color: transparent; }
.slot:hover .car, .slot:focus-visible .car, .slot.on .car { color: var(--signal); }
.slot:focus-visible, .slot:hover { outline: none; }
.slot:hover .val, .slot:focus-visible .val { color: var(--signal); }
.slot .lab { grid-column: 2; font-size: var(--small); letter-spacing: .1em; text-transform: uppercase; color: var(--frost); }
.slot .val { grid-column: 2; color: var(--bone); }
.slot.gpu .val { font-size: var(--big); line-height: 1.2; color: var(--ivory); letter-spacing: .03em; }
.slot.on .lab, .slot.on .val { color: var(--signal); }
.slot .sub { grid-column: 2; font-size: var(--small); color: var(--frost); }
.switch { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.rest { display: flex; flex-direction: column; gap: 8px; }
.val.none { color: var(--signal); }
.rest .slot { grid-template-columns: 1.1em 5.6em 1fr; align-items: baseline; }
.rest .slot .lab { grid-column: 2; }
.rest .slot .val { grid-column: 3; line-height: 1.2; }
.rest .slot .use, .rest .slot .mini { grid-column: 3; }
.verbs { margin-top: 4px; gap: 4px; }

.rig { isolation: isolate; position: relative; width: min(100cqw, calc(100cqh * 1.28)); aspect-ratio: 1.28; }
.count { position: absolute; left: 1%; bottom: 100%; z-index: 30; font-size: var(--small); letter-spacing: .1em; text-transform: uppercase; color: var(--bone); white-space: nowrap; padding-bottom: 2px; }
.rig img { position: absolute; }
.rig .ghost { opacity: .45; }
.rig .drop { animation: drop .5s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-5%) scale(1.03); filter: brightness(1.8); } to { opacity: 1; transform: none; filter: none; } }
.hallbox { position: relative; width: min(100cqw, calc(100cqh * 2.3)); aspect-ratio: 2.3; isolation: isolate; }
.hall { position: absolute; inset: 0; }
.hallrow { position: absolute; display: block; }
.rackline { position: absolute; inset: 0; display: block; }
.rackline img { position: absolute; top: 0; height: 100%; object-fit: contain; object-position: bottom; filter: drop-shadow(0 -4px 6px #000); }
.rackline .ghost { opacity: .45; }
.rackline .drop { animation: drop .5s cubic-bezier(.16, 1, .3, 1) both; }
.rowtag { position: absolute; right: 100%; bottom: 4%; padding-right: 8px; font-size: var(--small); letter-spacing: .1em; text-transform: uppercase; color: var(--frost); white-space: nowrap; }
.hallrow.on .rowtag, .hallrow:hover .rowtag, .hallrow:focus-visible .rowtag { color: var(--signal); }
.hallrow:focus-visible { outline: none; }
.hallempty { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; }
.rowverbs { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 14px; }
.rackitem { display: flex; flex-direction: column; gap: 2px; }
.rackitem .item { grid-template-columns: 52px 1fr; gap: 12px; }
.rackitem .item .pic img { max-height: 128px; }
.rowbuy { padding-left: 64px; align-self: flex-start; }
.center .status { max-width: 78ch; }
.status { text-align: center; max-width: 62ch; display: grid; justify-items: center; gap: 2px; }
.status .act { justify-content: center; }

.shop { display: flex; flex-direction: column; gap: 24px; padding-block: 2px 44px; }
.plain { margin: 0; font-weight: normal; color: var(--ivory); }
.help { margin: 6px 0 0; color: var(--bone); max-width: 62ch; line-height: 1.4; }
.done { margin: 0; color: var(--signal); }
.quick { display: flex; flex-direction: column; gap: 4px; }
.tag { font-size: var(--small); letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
.item { display: grid; grid-template-columns: minmax(88px, 34%) 1fr; gap: 14px; align-items: center; width: 100%; }
.item .pic { perspective: 500px; display: grid; place-items: center; min-height: 60px; }
.item .pic img { width: 100%; max-height: 100px; object-fit: contain; }
.item.tilt .pic img { transform: rotateY(-22deg) rotateX(10deg) rotateZ(-2deg); transition: transform .3s cubic-bezier(.16, 1, .3, 1); }
.item.tilt:hover .pic img, .item.tilt:focus-visible .pic img { transform: rotateY(-6deg) rotateX(3deg); }
.item .name { color: var(--ivory); letter-spacing: .03em; }
.item .price { font-size: var(--big); line-height: 1.25; color: var(--ivory); }
.item .why { color: var(--bone); line-height: 1.3; }
.item .price { display: inline-block; margin-block: 2px; }
.item .why + .why { margin-top: 1px; }
.item:hover .name, .item:focus-visible .name, .item:hover .price, .item:focus-visible .price { color: var(--signal); }
.item:focus-visible, .item:hover { outline: none; }
.item.off .pic img { opacity: .42; }
.item.off .name, .item.off .price { color: var(--frost); }
.item.off .why { color: var(--frost); }

.foot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.read { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 28px; font-size: var(--big); }
.blocks { display: grid; grid-template-columns: repeat(40, 1fr); gap: clamp(2px, .35vw, 6px); height: 12px; }
.blocks i { background: #1d1d1a; display: block; }
.blocks i.lit { background: var(--ivory); }
.blocks i.house { background: #6e6c62; }
.blocks i.cool { background: var(--bone); }
.blocks i.safe { box-shadow: 0 -5px 0 0 var(--signal), 0 5px 0 0 var(--signal); }
.blocks i.hot { background: var(--signal); }
.legend { display: flex; flex-wrap: wrap; gap: 0 22px; letter-spacing: .04em; }
.limitline { color: var(--bone); width: 100%; min-height: 1.4em; }
.limitline:hover, .limitline:focus-visible { color: var(--signal); outline: none; }

/* Room: every floor spot */

/* Status: the day's money and the markets */

/* What's behind a gauge */

/* The room fits the space between header and footer at any window size, so its front row is never under the footer. */
.floorpage { container-type: size; }
.world { position: relative; width: 100%; max-height: calc(100cqh - 2px); aspect-ratio: 1; isolation: isolate; margin-inline: auto; }

/* Models */

.wide { -webkit-mask-image: linear-gradient(#000 calc(100% - 26px), transparent); mask-image: linear-gradient(#000 calc(100% - 26px), transparent); }

/* Moments */
.takeover { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: start; gap: 16px; padding-block: 24px; padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); background: rgba(0, 0, 0, .86); overflow-y: auto; }
.takeover h2 { font-size: clamp(40px, 9vw, 150px); line-height: .98; margin: 0; font-weight: normal; letter-spacing: 0; text-shadow: .045em 0 currentColor, 0 .03em currentColor, .045em .03em currentColor; }
